apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-route
  namespace: gitea
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik

  hostnames:
    - logging-test.vtcgame.vn

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gitea

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: gitea-http
          port: 3000