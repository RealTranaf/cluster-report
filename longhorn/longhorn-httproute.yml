apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-route
  namespace: longhorn-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik

  hostnames:
    - logging-test.vtcgame.vn

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /longhorn
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: longhorn-auth

        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: longhorn-buffering

      backendRefs:
        - name: longhorn-frontend
          port: 80