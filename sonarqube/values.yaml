community:
  enabled: true

sonarWebContext: /sonarqube

monitoringPasscodeSecretName: sonarqube-monitoring
monitoringPasscodeSecretKey: monitoring-passcode

service:
  type: ClusterIP
  externalPort: 9000
  internalPort: 9000

persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 20Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2
    memory: 4Gi