apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik

  hostnames:
    - logging-test.vtcgame.vn

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sonarqube

      backendRefs:
        - name: sonarqube-sonarqube
          port: 9000