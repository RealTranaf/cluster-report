apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-route
  namespace: gitlab
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik

  hostnames:
    - logging-test.vtcgame.vn

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gitlab
      backendRefs:
        - name: gitlab
          port: 80