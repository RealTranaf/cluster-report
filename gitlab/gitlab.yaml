apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
  namespace: gitlab
spec:
  serviceName: gitlab
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
            - name: ssh
              containerPort: 22

          envFrom:
            - configMapRef:
                name: gitlab-config

          env:
            - name: GITLAB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitlab-oidc
                  key: GITLAB_OIDC_CLIENT_SECRET

          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

          volumeMounts:
            - name: gitlab-data
              mountPath: /etc/gitlab
              subPath: config
            - name: gitlab-data
              mountPath: /var/log/gitlab
              subPath: logs
            - name: gitlab-data
              mountPath: /var/opt/gitlab
              subPath: data
            - name: shm
              mountPath: /dev/shm

      volumes:
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: ClusterIP
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: ssh
      port: 22
      targetPort: 22